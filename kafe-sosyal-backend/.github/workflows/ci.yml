name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kafe
          POSTGRES_PASSWORD: kafe
          POSTGRES_DB: kafe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kafe -d kafe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Yalnızca CI için sahte anahtarlar
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      PHONE_PEPPER: ci-phone-pepper-0123456789
      DATA_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      REDIS_URL: redis://localhost:6379
      PGUSER: kafe
      PGPASSWORD: kafe
      PGHOST: localhost
      NO_COLOR: '1'
      SMOKE_PASSWORD: ci-smoke-Parola-12345

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json henüz yok: ilk başarılı kurulumdan sonra dosyayı commit'le ve `npm ci` kullan
      - run: npm install --no-audit --no-fund

      - name: Tip denetimi
        run: npm run typecheck

      - name: Birim testleri
        run: npm test

      - name: Derleme
        run: npm run build

      - name: Redis KV testi (gerçek Redis)
        run: npm run test:redis

      - name: Uçtan uca senaryo (gerçek PostgreSQL, boş _e2e veritabanı)
        env:
          DATABASE_URL: postgres://kafe:kafe@localhost:5432/kafe_e2e
        run: |
          createdb kafe_e2e
          npm run db:migrate
          npm run test:e2e

      - name: Duman testi (derlenmiş uygulama, gerçek HTTP)
        env:
          DATABASE_URL: postgres://kafe:kafe@localhost:5432/kafe_test
          NODE_ENV: development
          PORT: '3000'
        run: |
          npm run db:migrate
          npm run db:seed
          CAFE_ID=$(psql -d kafe_test -Atc "select id from cafes where name = 'Coffee Lab (Demo)'")
          CAFE_PASSWORD="$SMOKE_PASSWORD" npm run cafe:create -- "$CAFE_ID" smoke-cafe@example.com owner
          ADMIN_PASSWORD="$SMOKE_PASSWORD" npm run admin:create -- smoke-admin@example.com "Duman Yönetici" admin
          node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/v1/cafes; then break; fi
            sleep 1
          done
          SERVER_LOG=server.log npm run test:smoke

      - name: Sunucu günlüğü (başarısızlıkta)
        if: failure()
        run: cat server.log || true

      # Bilinen zafiyetli bağımlılıkları raporlar; sonucu bloklamaz
      - name: Bağımlılık denetimi
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
